<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="Email inbox, sending and account management.">
  <title>Cloud Mail</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <link rel="manifest" id="app-manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const temporaryApp = window.location.hostname.startsWith('temp.')
    const publicPage = temporaryApp || window.location.pathname === '/find'
    if (temporaryApp) document.documentElement.classList.add('temp-app')
    const supportedLanguages = new Set(['zh', 'en', 'es', 'fr', 'ja', 'ko', 'de', 'pt', 'ru', 'it', 'id', 'vi', 'tr', 'ar', 'hi'])
    const normalizeLanguage = value => {
      if (typeof value !== 'string') return null
      const parts = value.toLowerCase().replaceAll('_', '-').split('-')
      if (parts[0] === 'zh' && parts.some(part => ['hant', 'tw', 'hk', 'mo'].includes(part))) return null
      if (parts[0] === 'pt' && parts.includes('pt', 1)) return null
      return supportedLanguages.has(parts[0]) ? parts[0] : null
    }
    let languageSettings
    try { languageSettings = JSON.parse(localStorage.getItem('setting') || 'null') } catch (_) {}
    const chosenLanguage = normalizeLanguage(publicPage ? languageSettings?.publicMailboxLanguage : languageSettings?.lang)
    const preferredLanguages = navigator.languages?.length ? navigator.languages : [navigator.language]
    const pageLanguage = chosenLanguage
      || preferredLanguages.map(normalizeLanguage).find(Boolean)
      || 'en'
    const localeTags = {zh:'zh-CN',en:'en-US',es:'es-ES',fr:'fr-FR',ja:'ja-JP',ko:'ko-KR',de:'de-DE',pt:'pt-BR',ru:'ru-RU',it:'it-IT',id:'id-ID',vi:'vi-VN',tr:'tr-TR',ar:'ar-SA',hi:'hi-IN'}
    document.documentElement.lang = localeTags[pageLanguage]
    document.documentElement.dir = pageLanguage === 'ar' ? 'rtl' : 'ltr'
    document.getElementById('app-manifest').href = `/manifest-${publicPage ? 'temp' : 'mail'}-${pageLanguage}.webmanifest`
    let uiStore
    try { uiStore = JSON.parse(localStorage.getItem('ui') || 'null') } catch (_) {}
    if (uiStore) {
      const root = document.documentElement
      root.classList.toggle('dark', Boolean(uiStore.dark));
      const metaTag = document.getElementById('theme-color-meta');
      const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
      metaTag.setAttribute('content', temporaryApp ? '#0a0e14' : (uiStore.dark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#FFFFFF' : '#F1F1F1')));
    }
    if (temporaryApp && !uiStore) document.getElementById('theme-color-meta').setAttribute('content', '#0a0e14')
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  .temp-app { background: #0a0e14; }
  .temp-app #loading-first { background: #0a0e14; }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(64, 158, 255, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #409EFF;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(64, 158, 255, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/app-icon-192.png" alt="Cloud Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
